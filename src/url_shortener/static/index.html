<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URL Shortener</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 600px;
    margin: 4rem auto;
    padding: 0 1rem;
    color: #222;
  }
  h1 {
    font-size: 1.5rem;
  }
  form {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  input[type="url"] {
    flex: 1;
    padding: 0.5rem;
    font-size: 1rem;
  }
  button {
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
  }
  #result {
    margin-top: 1.5rem;
  }
  #result a {
    word-break: break-all;
  }
  #error {
    margin-top: 1.5rem;
    color: #b00020;
  }
</style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form id="shorten-form">
    <input type="url" id="original-url" placeholder="https://example.com/some/long/path" required>
    <button type="submit">Shorten</button>
  </form>
  <div id="result"></div>
  <div id="error"></div>

  <script>
    const form = document.getElementById("shorten-form");
    const result = document.getElementById("result");
    const error = document.getElementById("error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.textContent = "";
      error.textContent = "";

      const originalUrl = document.getElementById("original-url").value;

      try {
        const response = await fetch("/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ original_url: originalUrl }),
        });

        const data = await response.json();

        if (!response.ok) {
          error.textContent = data.detail || "Something went wrong.";
          return;
        }

        result.innerHTML = `Short URL: <a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
      } catch (err) {
        error.textContent = "Could not reach the server.";
      }
    });
  </script>
</body>
</html>
